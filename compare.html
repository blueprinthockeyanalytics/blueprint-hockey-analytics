<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/bp-favicon.png">
<link rel="apple-touch-icon" href="assets/bp-favicon.png">
<title>Compare Players — Blueprint Hockey</title>
<link rel="stylesheet" href="shared.css?v=2">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
.bp-page-header { background: var(--navy); padding: 28px 24px 0; }
.bp-page-header-inner { max-width: 1000px; margin: 0 auto; }
.bp-page-title { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 34px; color: var(--white); letter-spacing: -0.5px; text-transform: uppercase; }
.bp-page-sub { font-size: 13px; color: var(--muted-dk); margin-top: 2px; font-weight: 500; padding-bottom: 20px; }

.picker-row { max-width: 1000px; margin: 0 auto; padding: 20px 24px; display: flex; gap: 16px; flex-wrap: wrap; }
.picker-slot { flex: 1; min-width: 280px; background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; position: relative; }
.picker-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.picker-search-input { width: 100%; padding: 9px 12px; border-radius: 7px; border: 1px solid var(--border); font-size: 14px; font-family: 'Inter', sans-serif; }
.picker-results { position: absolute; left: 16px; right: 16px; top: 100%; background: #fff; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); margin-top: 4px; max-height: 280px; overflow-y: auto; z-index: 20; display: none; }
.picker-results.open { display: block; }
.picker-result-row { padding: 8px 12px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
.picker-result-row:hover { background: var(--ice-dim); }
.mode-toggle { display: flex; gap: 6px; margin-top: 10px; }
.mode-btn { flex: 1; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; padding: 7px 0; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; color: var(--muted); }
.mode-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.picker-current { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--navy); min-height: 18px; }

.cmp-cards-output { max-width: 1000px; margin: 0 auto; padding: 0 24px 40px; }
.cmp-cards-empty { text-align: center; color: var(--muted); padding: 60px 24px; font-size: 14px; }

/* Each player's card is the real generated card (cards/{id}.html) shown in
   embed mode, so this page always matches the player pages exactly. */
.cmp-card-pair { display: flex; gap: 16px; align-items: flex-start; width: 100%; }
.cmp-card-column { flex: 1; min-width: 0; }
.cmp-frame { display: block; width: 100%; height: 980px; border: 0; background: transparent; }

@media (max-width: 860px) {
  .cmp-card-pair { flex-direction: column; }
  .cmp-card-column { width: 100%; }
}
@media (max-width: 720px) {
  .picker-row { padding: 16px 14px; }
  .cmp-cards-output { padding: 0 10px 32px; }
}
</style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="bp-page-header">
  <div class="bp-page-header-inner">
    <div class="bp-page-title">Compare Players</div>
    <div class="bp-page-sub">Pick any two players — any timeframe — and see them side by side</div>
  </div>
</div>

<div class="picker-row">
  <div class="picker-slot">
    <div class="picker-label">Player A</div>
    <input type="text" class="picker-search-input" id="search-a" placeholder="Search a player...">
    <div class="picker-results" id="results-a"></div>
    <div class="picker-current" id="current-a"></div>
    <div class="mode-toggle" id="mode-a">
      <button class="mode-btn active" data-mode="season">This Season</button>
      <button class="mode-btn" data-mode="career">3-Yr Weighted</button>
    </div>
  </div>
  <div class="picker-slot">
    <div class="picker-label">Player B</div>
    <input type="text" class="picker-search-input" id="search-b" placeholder="Search a player...">
    <div class="picker-results" id="results-b"></div>
    <div class="picker-current" id="current-b"></div>
    <div class="mode-toggle" id="mode-b">
      <button class="mode-btn active" data-mode="season">This Season</button>
      <button class="mode-btn" data-mode="career">3-Yr Weighted</button>
    </div>
  </div>
</div>

<div class="cmp-cards-output" id="cmp-cards-output">
  <div class="cmp-cards-empty">Pick two players above to compare them.</div>
</div>

<div class="bp-footer">
  <strong>Blueprint Hockey</strong> &middot; blueprinthockeyanalytics.com &middot; Model v12 &middot; Data: NHL API
</div>

<script src="nav-search.js?v=2"></script>
<script>
fetch('nav.html').then(r => r.text()).then(html => {
  document.getElementById('nav-placeholder').innerHTML = html;
  document.querySelector('[data-nav="compare"]')?.classList.add('active');
  bpInitNavSearch();
});

// Cards come straight from cards/{playerId}.html (built by
// nhl_generate_card.py) in embed mode -- #embed-season or #embed-career shows
// just that one card, with its own Instagram / X Save and Share buttons. The
// card page reports its height so the frame fits it exactly.
window.addEventListener('message', (e) => {
  const h = e.data && e.data.height;
  if (!h) return;
  document.querySelectorAll('.cmp-frame').forEach(f => {
    if (f.contentWindow === e.source) f.style.height = (h + 4) + 'px';
  });
});

// ── Slot state + rendering ────────────────────────────────────────────────
const SLOT = {
  a: { playerId: null, mode: 'season' },
  b: { playerId: null, mode: 'season' },
};

function frameHtml(slotKey) {
  const { playerId, mode } = SLOT[slotKey];
  return `<div class="cmp-card-column"><iframe class="cmp-frame" id="frame-${slotKey}"
    src="cards/${playerId}.html#embed-${mode}" title="Player ${slotKey.toUpperCase()} card" loading="eager"></iframe></div>`;
}

function renderOutput() {
  const output = document.getElementById('cmp-cards-output');
  if (!SLOT.a.playerId || !SLOT.b.playerId) {
    output.innerHTML = '<div class="cmp-cards-empty">Pick two players above to compare them.</div>';
    return;
  }
  // Only a mode change for a player already shown? just change the frame's
  // hash (no reload); otherwise (re)build both frames.
  const fa = document.getElementById('frame-a'), fb = document.getElementById('frame-b');
  const want = { a: `cards/${SLOT.a.playerId}.html`, b: `cards/${SLOT.b.playerId}.html` };
  if (fa && fb && fa.src.split('#')[0].endsWith(want.a) && fb.src.split('#')[0].endsWith(want.b)) {
    [['a', fa], ['b', fb]].forEach(([k, f]) => {
      const h = `embed-${SLOT[k].mode}`;
      if (f.contentWindow && f.contentWindow.location.hash !== '#' + h) f.contentWindow.location.hash = h;
    });
    return;
  }
  output.innerHTML = `<div class="cmp-card-pair">${frameHtml('a')}${frameHtml('b')}</div>`;
}

function setupSlot(slotKey) {
  const input = document.getElementById(`search-${slotKey}`);
  const results = document.getElementById(`results-${slotKey}`);
  const current = document.getElementById(`current-${slotKey}`);
  const modeGroup = document.getElementById(`mode-${slotKey}`);

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    if (!q) { results.classList.remove('open'); return; }
    const matches = BP_PLAYER_INDEX
      .filter(p => bpFold(p.fullName).includes(bpFold(q)))
      .sort((a,b) => b.WAR - a.WAR)
      .slice(0, 8);
    results.innerHTML = matches.map(p => `
      <div class="picker-result-row" onclick="selectSlotPlayer('${slotKey}', ${p.playerId}, '${p.fullName.replace(/'/g,"")}')">
        <span>${p.fullName}</span><span>${p.team}</span>
      </div>`).join('') || '<div class="picker-result-row">No players found</div>';
    results.classList.add('open');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest(`#search-${slotKey}`) && !e.target.closest(`#results-${slotKey}`)) {
      results.classList.remove('open');
    }
  });
  modeGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    modeGroup.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    SLOT[slotKey].mode = btn.dataset.mode;
    renderOutput();
  });
}

function selectSlotPlayer(slotKey, playerId, fullName) {
  SLOT[slotKey].playerId = playerId;
  document.getElementById(`current-${slotKey}`).textContent = fullName;
  document.getElementById(`search-${slotKey}`).value = '';
  document.getElementById(`results-${slotKey}`).classList.remove('open');
  renderOutput();
}

(async function init() {
  await bpLoadPlayerIndex();
  setupSlot('a');
  setupSlot('b');
})();
</script>
</body>
</html>
