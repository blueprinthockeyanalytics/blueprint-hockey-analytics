// ── Ported from nhl_generate_card.py — must stay in sync with the Python
// dicts/helpers of the same name if either one changes team colors, flag
// codes, or the percentile-bucket thresholds. ──────────────────────────────
const TEAM_COLOURS = {
  ANA:"#F47A38", ARI:"#8C2633", UTA:"#71AFE5", BOS:"#FFB81C", BUF:"#FFB81C",
  CGY:"#FAAF19", CAR:"#CE0000", CHI:"#CF0A2C", COL:"#236192", CBJ:"#CE1126",

const TEAM_BG = {

  CGY:"#CE1126", CAR:"#000000", CHI:"#CE0000", COL:"#6F263D", CBJ:"#002654",
  DAL:"#006847", DET:"#000000", EDM:"#041E42", FLA:"#041E42", LAK:"#111111",
  MIN:"#154734", MTL:"#AF1E2D", NSH:"#041E42", NJD:"#000000", NYI:"#003087",
  NYR:"#0038A8", OTT:"#C52032", PHI:"#000000", PIT:"#041E42", SJS:"#006D75",
  SEA:"#001B2B", STL:"#002F87", TBL:"#000000", TOR:"#00205B", VAN:"#00205B",
  VGK:"#000000", WSH:"#041E42", WPG:"#041E42", NHL:"#041E42"
};
const COUNTRY_FLAG = {
  CAN:"ca", USA:"us", SWE:"se", FIN:"fi", RUS:"ru", CZE:"cz", SVK:"sk",
  CHE:"ch", DEU:"de", AUT:"at", DNK:"dk", NOR:"no", LVA:"lv", BLR:"by",

  SVN:"si", HUN:"hu", ITA:"it"
};

function ordinal(n) {
  n = Math.round(n);
  if (n % 100 >= 11 && n % 100 <= 13) return n + 'th';
  return n + (['th','st','nd','rd','th'][Math.min(n % 10, 4)]);
}
function badgeClass(pct) { return pct >= 70 ? 'green' : pct >= 40 ? 'amber' : 'red'; }
function compClass(pct) { return pct >= 70 ? 'good' : pct >= 40 ? 'mid' : 'bad'; }
function formatAav(val) { return (!val || isNaN(val)) ? 'N/A' : '$' + val.toFixed(1) + 'M'; }
function inchesToFeet(inches) {
  if (!inches || isNaN(inches)) return '';
  inches = Math.round(inches);
  return Math.floor(inches / 12) + "'" + (inches % 12) + '"';
}

// ── Data store, loaded once ──────────────────────────────────────────────
let SEASON_ROWS = [], RATINGS_ROWS = [], CAREER_ROWS = [], CONTRACTS_ROWS = [], PLAYERS_ROWS = [];
let CURR_SEASON = 0;

async function loadAllData() {
  const [seasonText, ratingsText, careerText, contractsText, playersText] = await Promise.all([
    fetch('data/master_season.csv').then(r => r.text()),
    fetch('data/master_ratings.csv').then(r => r.text()),
    fetch('data/master_career.csv').then(r => r.text()),
    fetch('data/master_contracts.csv').then(r => r.text()),
    fetch('data/players.csv').then(r => r.text()),
  ]);
  SEASON_ROWS = bpParseCSVNum(seasonText);
  RATINGS_ROWS = bpParseCSVNum(ratingsText);
  CAREER_ROWS = bpParseCSVNum(careerText);
  CONTRACTS_ROWS = bpParseCSVNum(contractsText);
  PLAYERS_ROWS = bpParseCSVNum(playersText);
  CURR_SEASON = Math.max(...SEASON_ROWS.map(r => r.season));
}

function bpParseCSVNum(text) {
  const rows = bpParseCSV(text);
  return rows.map(r => {
    const obj = {};
    for (const k in r) {
      const v = r[k];
      obj[k] = (v !== '' && !isNaN(v)) ? Number(v) : v;
    }
    return obj;
  });
}

// ── Percentiles — mirrors compute_percentiles / compute_percentiles_multiyear
const COMP_COLS = [['WAR_evo','EVO'],['WAR_evd','EVD'],['WAR_pp','PP'],['WAR_pk','PK'],['WAR_pen','PEN'],['WAR_shoot','SH']];

function computePercentiles(rows, playerRow, posGroup) {
  const group = rows.filter(r => r.pos_group === posGroup);
  const pcts = {};
  COMP_COLS.forEach(([col]) => {
    const val = playerRow[col] || 0;
    pcts[col] = group.length ? Math.round(group.filter(r => (r[col]||0) < val).length / group.length * 100) : 50;
  });
  return pcts;
}

function compute82gpPace(playerId, nSeasons) {
  const hist = CAREER_ROWS.filter(r => r.playerId === playerId).sort((a,b) => a.season - b.season).slice(-nSeasons);
  const totalGp = hist.reduce((s,r) => s + (r.gp||0), 0);
  if (!hist.length || totalGp === 0) return null;
  const pace = (col) => (hist.reduce((s,r) => s + (r[col]||0), 0) / totalGp) * 82;
  const toiPgSec = (hist.reduce((s,r) => s + (r.toi_ev_hr||0), 0) * 3600) / totalGp;
  return {
    seasonLabels: hist.map(r => r.season_label),
    nSeasons: hist.length,
    totalGp, goals: pace('goals'), assists: pace('assists'), points: pace('points'), toiPgSec
  };
}

function fmtToi(sec) {
  if (!sec || sec <= 0) return '\u2013';
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(Math.round(sec%60)).padStart(2,'0');
}

function calcAge(birthDate) {
  if (!birthDate) return '';
  const bd = new Date(birthDate);
  const today = new Date();
  let age = today.getFullYear() - bd.getFullYear();
  if (today.getMonth() < bd.getMonth() || (today.getMonth() === bd.getMonth() && today.getDate() < bd.getDate())) age--;
  return String(age);
}

// ── Build all the data a card needs, for one player + one mode ──────────────
function getCardData(playerId, mode) {
  const seasonRow = SEASON_ROWS.find(r => r.playerId === playerId && r.season === CURR_SEASON);
  const ratingsRow = RATINGS_ROWS.find(r => r.playerId === playerId);
  const playerBio = PLAYERS_ROWS.find(r => r.playerId === playerId);
  const contractRow = CONTRACTS_ROWS.find(r => r.playerId === playerId);
  if (!seasonRow) return null;

  const posGroup = seasonRow.pos_group;
  const team = seasonRow.team;
  const name = seasonRow.display_name || seasonRow.name;

  const pctsSeason = computePercentiles(SEASON_ROWS.filter(r => r.season === CURR_SEASON), seasonRow, posGroup);
  const pctsCareer = ratingsRow ? computePercentiles(RATINGS_ROWS, ratingsRow, posGroup) : pctsSeason;
  const pace = compute82gpPace(playerId, 3);

  const arc = CAREER_ROWS.filter(r => r.playerId === playerId).sort((a,b) => a.season - b.season);
  const isPeakIdx = arc.length ? arc.reduce((best,r,i,a) => r.WAR > a[best].WAR ? i : best, 0) : -1;

  const aav = contractRow ? Number(contractRow.aav) : 0;
  const yearsLeft = contractRow && !isNaN(contractRow.years_remaining) ? Math.round(contractRow.years_remaining) : 0;
  const surplus = contractRow ? Number(contractRow.savings_m) || 0 : 0;
  const marketVal = aav + surplus;

  const spanLabel = pace && pace.seasonLabels.length
    ? (pace.nSeasons > 1 ? `${pace.seasonLabels[0]} to ${pace.seasonLabels[pace.seasonLabels.length-1]}` : pace.seasonLabels[0])
    : seasonRow.season_label;

  // Previous team, for the headshot fallback chain — mirrors the same
  // logic used by the individually-generated player cards, so a player
  // who was traded doesn't just fail on the one hardcoded season/team.
  const priorTeamRows = CAREER_ROWS.filter(r => r.playerId === playerId && r.season < CURR_SEASON)
    .sort((a, b) => b.season - a.season);
  const prevTeam = priorTeamRows.length ? (priorTeamRows[0].team || team) : team;

  return {
    playerId, mode, name, team, posGroup,
    position: playerBio ? playerBio.position : seasonRow.position,
    jersey: playerBio ? playerBio.jersey : '',
    nationality: playerBio ? playerBio.nationality : 'CAN',
    heightIn: playerBio ? playerBio.height_in : null,
    weightLbs: playerBio ? playerBio.weight_lbs : null,
    age: playerBio ? calcAge(playerBio.birth_date) : '',
    seasonLabel: seasonRow.season_label,
    spanLabel,
    war: mode === 'season' ? Number(seasonRow.WAR) : (ratingsRow ? Number(ratingsRow.WAR) : Number(seasonRow.WAR)),
    gar: mode === 'season' ? Number(seasonRow.GAR) : (ratingsRow ? Number(ratingsRow.GAR) : Number(seasonRow.GAR)),
    gp: mode === 'season' ? seasonRow.gp : (pace ? pace.totalGp : seasonRow.gp),
    goals: mode === 'season' ? seasonRow.goals : (pace ? Math.round(pace.goals) : seasonRow.goals),
    assists: mode === 'season' ? seasonRow.assists : (pace ? Math.round(pace.assists) : seasonRow.assists),
    points: mode === 'season' ? seasonRow.points : (pace ? Math.round(pace.points) : seasonRow.points),
    toiPg: mode === 'season'
      ? fmtToi(seasonRow.gp > 0 ? (seasonRow.toi_5v5_hr*3600/seasonRow.gp) : 0)
      : (pace ? fmtToi(pace.toiPgSec) : '\u2013'),
    pcts: mode === 'season' ? pctsSeason : pctsCareer,
    rawRow: mode === 'season' ? seasonRow : (ratingsRow || seasonRow),
    arcLabels: arc.map(r => `${String(r.season).slice(-2)}-${String(r.season+1).slice(-2)}`),
    arcData: arc.map(r => Math.round(r.WAR*100)/100),
    arcIsPeak: arc.map((r,i) => i === isPeakIdx),
    aav, yearsLeft, surplus, marketVal,
    logoUrl: `https://assets.nhle.com/logos/nhl/svg/${team}_dark.svg`,
    // Local headshot first (same-origin, always exportable) — only fall
    // back to NHL's CDN, across several seasons/teams, if no local file
    // exists. Previously this only ever tried one hardcoded season/team
    // on the CDN with no fallback at all, so any player whose mug wasn't
    // at that exact URL (e.g. a mid-season trade) simply failed.
    headshotUrl: `cards/headshots/${playerId}.png`,
    headshotFallbacks: [
      `https://assets.nhle.com/mugs/nhl/20242025/${prevTeam}/${playerId}.png`,
      `https://assets.nhle.com/mugs/nhl/20232024/${prevTeam}/${playerId}.png`,
      `https://assets.nhle.com/mugs/nhl/20222023/${prevTeam}/${playerId}.png`,
      `https://assets.nhle.com/mugs/nhl/20232024/${team}/${playerId}.png`,
      `https://assets.nhle.com/mugs/nhl/20212022/${prevTeam}/${playerId}.png`,
      `https://assets.nhle.com/mugs/nhl/20202021/${prevTeam}/${playerId}.png`,
      `https://assets.nhle.com/mugs/nhl/20192020/${prevTeam}/${playerId}.png`,
    ],
  };
}

function posLabel(position) {
  return {C:'C', L:'LW', R:'RW', D:'D'}[position] || position;
}

// ── Render one full card's HTML ──────────────────────────────────────────
function renderCard(d, slot) {
  const stripeColour = TEAM_COLOURS[d.team] || TEAM_COLOURS.NHL;
  const headerBg = TEAM_BG[d.team] || TEAM_BG.NHL;
  const flagCode = COUNTRY_FLAG[d.nationality] || 'ca';
  const physical = [inchesToFeet(d.heightIn), d.weightLbs ? Math.round(d.weightLbs) + ' lbs' : ''].filter(Boolean).join(' \u00b7 ');
  const badgeLabel = d.mode === 'season' ? `${d.seasonLabel} Season` : `3-Year Weighted \u00b7 ${d.spanLabel}`;
  const statLabel = d.mode === 'season' ? `${d.seasonLabel} Season` : `82-GP Pace \u00b7 Last 3 Seasons`;
  const compLabel = d.mode === 'season' ? `Impact by Component \u00b7 ${d.seasonLabel}` : `3-Yr Weighted Percentiles \u00b7 ${d.spanLabel}`;
  const gpLabel = d.mode === 'season' ? 'GP' : 'GP';
  const goalsLabel = d.mode === 'season' ? 'G' : 'G/82';
  const assistsLabel = d.mode === 'season' ? 'A' : 'A/82';
  const ptsLabel = d.mode === 'season' ? 'PTS' : 'P/82';

  const compRows = COMP_COLS.map(([col, label]) => {
    const pct = d.pcts[col] ?? 50;
    const raw = Number(d.rawRow[col] || 0);
    if ((label === 'PP' || label === 'PK') && raw === 0) {
      return `<div class="pcard-comp-row">
        <span class="pcard-comp-name na">${label}</span>
        <div class="pcard-bar-track"><div class="pcard-bar-fill" style="width:0%"></div></div>
        <span class="pcard-pct-badge na">N/A</span>
      </div>`;
    }
    const bc = badgeClass(pct), cc = compClass(pct);
    return `<div class="pcard-comp-row">
      <span class="pcard-comp-name ${cc}">${label}</span>
      <div class="pcard-bar-track"><div class="pcard-bar-fill ${bc}" style="width:${pct}%"></div></div>
      <span class="pcard-pct-badge ${bc}">${ordinal(pct)}</span>
    </div>`;
  }).join('');

  const valueClass = d.surplus >= 0 ? '' : ' over';
  const deltaStr = (d.surplus >= 0 ? '+' : '-') + '$' + Math.abs(d.surplus).toFixed(1) + 'M';
  const deltaDesc = d.surplus >= 0 ? 'Under market value' : 'Over market value';
  const deltaMeta = (d.surplus >= 0 ? 'Saving' : 'Costing') + ' $' + Math.abs(d.surplus).toFixed(1) + 'M/yr vs fair market';

  const cardId = `pcard-${slot}`;
  const chartId = `pchart-${slot}`;

  return `
<div class="cmp-card-column">
  <div class="pcard" id="${cardId}">
    <div class="pcard-badge" style="background:${headerBg}; color:#ffffff;">${badgeLabel}</div>
    <div class="pcard-header" style="background:${headerBg};">
      <div class="pcard-header-inner">
        <div class="pcard-headshot-wrap">
          <img src="${d.headshotUrl}" alt="${d.name}" data-fallbacks='${JSON.stringify(d.headshotFallbacks)}'
          onerror="(function(img){
            var tries = JSON.parse(img.dataset.fallbacks || '[]');
            var idx = parseInt(img.dataset.try || 0);
            img.dataset.try = idx + 1;
            if (idx < tries.length) { img.src = tries[idx]; }
            else { img.style.opacity = 0.3; }
          })(this)">
        </div>
        <div class="pcard-header-info">
          <div class="pcard-name-row">
            <div class="pcard-name">${d.name}</div>
            <span class="pcard-jersey">${d.jersey ? '#'+d.jersey : ''}</span>
            <img class="pcard-flag" src="https://flagcdn.com/w40/${flagCode}.png" alt="${d.nationality}">
          </div>
          <div class="pcard-tags">
            <span class="pcard-tag">${d.team}</span>
            <span class="pcard-tag">${posLabel(d.position)}</span>
            ${d.age ? `<span class="pcard-tag">Age ${d.age}</span>` : ''}
          </div>
          <div class="pcard-physical"><span class="pcard-physical-text">${physical}</span></div>
        </div>
        <div class="pcard-war-box">
          <div class="pcard-war-label">WAR</div>
          <div class="pcard-war-value">${d.war >= 0 ? '+' : ''}${d.war.toFixed(2)}</div>
          <div class="pcard-war-gar">${d.gar.toFixed(1)} GAR</div>
        </div>
      </div>
      <div style="position:absolute; bottom:0; left:0; right:0; height:5px; background:${stripeColour}; z-index:2;"></div>
    </div>
    <div class="pcard-body">
      <img class="pcard-body-logo" src="${d.logoUrl}" alt="">
      <div class="pcard-section-label">${statLabel}</div>
      <div class="pcard-stat-grid">
        <div class="pcard-stat-box"><div class="pcard-stat-val">${d.gp}</div><div class="pcard-stat-lbl">${gpLabel}</div></div>
        <div class="pcard-stat-box"><div class="pcard-stat-val">${d.goals}</div><div class="pcard-stat-lbl">${goalsLabel}</div></div>
        <div class="pcard-stat-box"><div class="pcard-stat-val">${d.assists}</div><div class="pcard-stat-lbl">${assistsLabel}</div></div>
        <div class="pcard-stat-box"><div class="pcard-stat-val">${d.points}</div><div class="pcard-stat-lbl">${ptsLabel}</div></div>
        <div class="pcard-stat-box"><div class="pcard-stat-val">${d.toiPg}</div><div class="pcard-stat-lbl">TOI/G</div></div>
      </div>
      <div class="pcard-section-label">${compLabel}</div>
      <div class="pcard-components">${compRows}</div>
      <div class="pcard-section-label">Career Arc</div>
      <div class="pcard-chart-wrap"><canvas id="${chartId}"></canvas></div>
      <div class="pcard-section-label">Contract</div>
      <div class="pcard-contract-grid">
        <div class="pcard-contract-box"><div class="pcard-contract-val">${formatAav(d.aav)}</div><div class="pcard-contract-lbl">AAV</div></div>
        <div class="pcard-contract-box"><div class="pcard-contract-val">${d.yearsLeft}</div><div class="pcard-contract-lbl">Years Left</div></div>
        <div class="pcard-contract-box"><div class="pcard-contract-val">${d.marketVal ? formatAav(d.marketVal) : 'N/A'}</div><div class="pcard-contract-lbl">Market Value</div></div>
      </div>
      <div class="pcard-value-row${valueClass}">
        <div><div class="pcard-value-delta">${deltaStr}</div><div class="pcard-value-desc">${deltaDesc}</div></div>
        <div class="pcard-value-meta">${deltaMeta}</div>
      </div>
      <div class="pcard-brand-footer">
        <div class="pcard-brand-name">Blueprint Hockey</div>
        <div class="pcard-brand-url">blueprinthockeyanalytics.com</div>
      </div>
    </div>
  </div>
  <div class="cmp-card-toolbar">
    <button class="cmp-toolbar-btn primary" onclick="shareCard('${cardId}', '${d.name.replace(/\s/g,'_')}_${d.mode}')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
      Share
    </button>
    <button class="cmp-toolbar-btn secondary" onclick="saveCard('${cardId}', '${d.name.replace(/\s/g,'_')}_${d.mode}')">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Save
    </button>
  </div>
</div>`;
}

function renderChart(d, slot) {
  const peakColors = d.arcIsPeak.map(p => p ? '#F5C518' : '#041E42');
  const peakRadii = d.arcIsPeak.map(p => p ? 6 : 4);
  const dataMin = d.arcData.length ? Math.min(...d.arcData) : 0;
  const dataMax = d.arcData.length ? Math.max(...d.arcData) : 5;
  const arcMin = Math.floor((dataMin - 0.5) * 2) / 2;
  const arcMax = Math.ceil((dataMax + 0.5) * 2) / 2;
  const ctx = document.getElementById(`pchart-${slot}`).getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: { labels: d.arcLabels, datasets: [{
      data: d.arcData, borderColor: '#041E42', borderWidth: 2.5,
      pointBackgroundColor: peakColors, pointBorderColor: '#041E42', pointBorderWidth: 2,
      pointRadius: peakRadii, pointHoverRadius: 7, fill: true,
      backgroundColor: (c) => {
        const g = c.chart.ctx.createLinearGradient(0,0,0,96);
        g.addColorStop(0,'rgba(4,30,66,0.12)'); g.addColorStop(1,'rgba(4,30,66,0)');
        return g;
      },
      tension: 0.35
    }]},
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        annotation: { annotations: { zero: { type: 'line', yMin: 0, yMax: 0, borderColor: 'rgba(0,0,0,0.15)', borderWidth: 1, borderDash: [4,3] } } },
        tooltip: {
          backgroundColor: '#041E42', titleColor: '#7AAAD8', bodyColor: '#fff', padding: 8,
          callbacks: { label: (c) => d.arcIsPeak[c.dataIndex] ? ` ${c.raw} WAR \u00b7 Career Best` : ` ${c.raw} WAR` }
        }
      },
      scales: {
        x: { grid: { display: false }, border: { display: false }, ticks: { font: { size: 10, weight: '600' }, color: '#aaa' } },
        y: { min: arcMin, max: arcMax, grid: { color: '#f0f0f3' }, border: { display: false }, ticks: { font: { size: 10 }, color: '#bbb', stepSize: 0.5 } }
      }
    }
  });
}

// ── Share / Save (identical approach to nhl_generate_card.py) ────────────
async function captureCard(cardId) {
  const card = document.getElementById(cardId);
  return await html2canvas(card, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function shareCard(cardId, filenameBase) {
  try {
    const canvas = await captureCard(cardId);
    canvas.toBlob(async (blob) => {
      const file = new File([blob], filenameBase + '.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Blueprint Hockey' }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      downloadBlob(blob, filenameBase + '.png');
    }, 'image/png');
  } catch (e) { console.error(e); alert('Could not generate image for sharing.'); }
}
async function saveCard(cardId, filenameBase) {
  try {
    const canvas = await captureCard(cardId);
    canvas.toBlob((blob) => downloadBlob(blob, filenameBase + '.png'), 'image/png');
  } catch (e) { console.error(e); alert('Could not generate image.'); }
}

// ── Slot state + rendering ────────────────────────────────────────────────
const SLOT = {
  a: { playerId: null, mode: 'season' },
  b: { playerId: null, mode: 'season' },
};

function renderOutput() {
  const output = document.getElementById('cmp-cards-output');
  if (!SLOT.a.playerId || !SLOT.b.playerId) {
    output.innerHTML = '<div class="cmp-cards-empty">Pick two players above to compare them.</div>';
    return;
  }
  const dataA = getCardData(SLOT.a.playerId, SLOT.a.mode);
  const dataB = getCardData(SLOT.b.playerId, SLOT.b.mode);
  if (!dataA || !dataB) {
    output.innerHTML = '<div class="cmp-cards-empty">Could not find data for one of these players.</div>';
    return;
  }
  output.innerHTML = `<div class="cmp-card-pair">${renderCard(dataA, 'a')}${renderCard(dataB, 'b')}</div>`;
  renderChart(dataA, 'a');
  renderChart(dataB, 'b');
}

function setupSlot(slotKey) {
  const input = document.getElementById(`search-${slotKey}`);
  const results = document.getElementById(`results-${slotKey}`);
  const current = document.getElementById(`current-${slotKey}`);
  const modeGroup = document.getElementById(`mode-${slotKey}`);

  input.addEventListener('input', () => {
    const q = input.value.toLowerCase();
    if (!q) { results.classList.remove('open'); return; }
    const matches = BP_PLAYER_INDEX
      .filter(p => p.fullName.toLowerCase().includes(q))
      .sort((a,b) => b.WAR - a.WAR)
      .slice(0, 8);
    results.innerHTML = matches.map(p => `
      <div class="picker-result-row" onclick="selectSlotPlayer('${slotKey}', ${p.playerId}, '${p.fullName.replace(/'/g,"")}')">
        <span>${p.fullName}</span><span>${p.team}</span>
      </div>`).join('') || '<div class="picker-result-row">No players found</div>';
    results.classList.add('open');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest(`#search-${slotKey}`) && !e.target.closest(`#results-${slotKey}`)) {
      results.classList.remove('open');
    }
  });
  modeGroup.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    modeGroup.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    SLOT[slotKey].mode = btn.dataset.mode;
    renderOutput();
  });
}

function selectSlotPlayer(slotKey, playerId, fullName) {
  SLOT[slotKey].playerId = playerId;
  document.getElementById(`current-${slotKey}`).textContent = fullName;
  document.getElementById(`search-${slotKey}`).value = '';
  document.getElementById(`results-${slotKey}`).classList.remove('open');
  renderOutput();
}

(async function init() {
  await bpLoadPlayerIndex();
  await loadAllData();
  setupSlot('a');
  setupSlot('b');
})();
</script>
