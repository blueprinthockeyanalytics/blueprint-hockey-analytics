<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/BlueprintLogo87.png">
<link rel="apple-touch-icon" href="assets/BlueprintLogo87.png">
<title>Player — Blueprint Hockey</title>
<link rel="stylesheet" href="shared.css?v=2">
<style>
body { background: #ffffff; margin: 0; padding: 0; }
.player-wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; background: #ffffff; box-sizing: border-box; }
.bp-back { font-size: 12px; color: var(--muted); margin: 0 0 14px 0; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.bp-back:hover { color: var(--navy); }
iframe { width: 100%; border: none; background: #ffffff; display: block; min-height: 760px; }
@media (max-width: 480px) {
  .player-wrap { padding: 14px 10px 28px; }
}
</style>
</head>
<body>

<div id="nav-placeholder"></div>

<div class="player-wrap">
  <a href="javascript:history.back()" class="bp-back">&larr; Back</a>
  <iframe id="card-frame" src=""></iframe>
</div>

<script src="nav-search.js?v=2"></script>
<script>
fetch('nav.html').then(r => r.text()).then(html => {
  document.getElementById('nav-placeholder').innerHTML = html;
  bpInitNavSearch();
});

const id = new URLSearchParams(window.location.search).get('id');
if (id) {
  // Cards are generated by nhl_generate_card.py into cards/{playerId}.html.
  // Cache-bust with a timestamp so browsers always fetch the latest
  // regenerated card instead of reusing a stale cached copy of the iframe.
  document.getElementById('card-frame').src = `cards/${id}.html?t=${Date.now()}`;
}

window.addEventListener('message', e => {
  if (e.data && e.data.height) {
    document.getElementById('card-frame').style.height = e.data.height + 'px';
  }
});
</script>
</body>
</html>
